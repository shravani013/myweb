
<!DOCTYPE html>
<html>
<head>
    <title>My Colorful Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2, #f093fb);
            color: white;
            text-align: center;
            min-height: 100vh;
        }

        header {
            padding: 25px;
            background: rgba(0, 0, 0, 0.2);
        }

        nav {
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
            font-weight: bold;
        }

        .hero {
            padding: 65px 20px;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 30px;
        }

        button {
            padding: 14px 28px;
            border: none;
            border-radius: 25px;
            background: #ffcc70;
            color: #333;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: white;
            transform: scale(1.05);
        }

        .cards {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            color: #5b3a8a;
            padding: 30px;
            border-radius: 20px;
            width: 240px;
            box-shadow: 0 8px 20px #33333340;
        }

        .card h2 {
            margin-bottom: 12px;
        }

        footer {
            padding: 25px;
            margin-top: 30px;
            background: rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
